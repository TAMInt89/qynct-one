<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qynct One | TOSLIM ASAD MAHI</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --accent: #0071e3; --white: #ffffff; }
        body, html { margin: 0; padding: 0; background: var(--white); font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* iCloud-এর চেয়ে অ্যাডভান্সড অ্যানিমেটেড কোর */
        .core-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        .glowing-core {
            width: 250px; height: 250px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00a2ff, #0071e3);
            box-shadow: 0 20px 80px rgba(0, 113, 227, 0.3), inset -10px -10px 40px rgba(0,0,0,0.1);
            animation: coreBreathe 8s infinite alternate ease-in-out;
            cursor: pointer; transition: 0.5s;
        }
        .glowing-core:hover { transform: scale(1.1); box-shadow: 0 40px 100px rgba(0, 113, 227, 0.5); }

        @keyframes coreBreathe { 0% { transform: scale(1); filter: hue-rotate(0deg); } 100% { transform: scale(1.05); filter: hue-rotate(20deg); } }

        .brand-name { font-size: 80px; font-weight: 800; letter-spacing: -4px; margin-top: 40px; color: #000; opacity: 0; }

        /* অ্যাডভান্সড সাইন-ইন বাটন */
        .sign-in-btn {
            margin-top: 60px; padding: 18px 60px; border-radius: 40px; background: #000;
            color: #fff; text-decoration: none; font-weight: 700; font-size: 18px;
            transition: 0.4s; border: none; cursor: pointer; opacity: 0;
        }
        .sign-in-btn:hover { background: #333; transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .footer-credit { position: fixed; bottom: 50px; text-align: center; color: #86868b; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
    </style>
</head>
<body>

    <div class="core-container">
        <div class="glowing-core" id="logo-core"></div>
        <div class="brand-name" id="brand-text">Qynct One</div>
        <button class="sign-in-btn" id="login-btn">Sign In to Qynct</button>
    </div>

    <div class="footer-credit">Directed by Toslim Asad Mahi</div>

    <script>
        // প্রফেশনাল এন্ট্রান্স অ্যানিমেশন
        window.onload = () => {
            gsap.to("#brand-text", { duration: 2, opacity: 1, y: -20, ease: "power4.out", delay: 0.5 });
            gsap.to("#login-btn", { duration: 2, opacity: 1, y: -20, ease: "power4.out", delay: 1 });
        };

        // মাউস ইন্টারঅ্যাকশন
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.02;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.02;
            gsap.to("#logo-core", { duration: 1, x: moveX, y: moveY, ease: "power2.out" });
        });
    </script>
</body>
</html>
