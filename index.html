<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qynct One | The Universal Ecosystem</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; color: #1d1d1f; }
        .nav { padding: 20px; text-align: center; border-bottom: 1px solid #d2d2d7; }
        .hero { text-align: center; padding: 100px 20px; background: radial-gradient(circle at center, #fbfbfb, #f5f5f7); }
        h1 { font-size: 56px; font-weight: 700; margin: 0; }
        p { font-size: 24px; color: #86868b; margin: 10px 0 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px; max-width: 1200px; margin: 0 auto; }
        .card { background: #f5f5f7; border-radius: 20px; padding: 40px; text-align: center; transition: 0.3s; text-decoration: none; color: inherit; }
        .card:hover { transform: scale(1.03); background: #f0f0f2; }
        .btn { background: #0071e3; color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 20px; }
        .badge { font-size: 12px; background: #34c759; color: white; padding: 4px 10px; border-radius: 10px; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="nav"><strong>Qynct One</strong></div>
    <div class="hero">
        <h1>Welcome to the Future.</h1>
        <p>One World. One Ecosystem. Zero Boundaries.</p>
        <div class="grid">
            <a href="https://onrender.com" class="card">
                <span class="badge">Hybrid (Online/Offline)</span>
                <h2>Zyvact</h2>
                <p>Social OS for the new generation.</p>
                <span class="btn">Launch Alpha</span>
            </a>
            <div class="card">
                <span class="badge">Coming Soon</span>
                <h2>Q-Finance</h2>
                <p>Secure financial freedom for everyone.</p>
            </div>
            <div class="card">
                <span class="badge">Coming Soon</span>
                <h2>Q-Stream</h2>
                <p>Entertainment without limits.</p>
            </div>
        </div>
    </div>
</body>
</html>
