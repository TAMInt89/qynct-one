<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QYNCT ONE | Establishing Infinite Connections</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #00e5ff; }
        body, html { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Moving Background Effect */
        .hero::before { content: ''; position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, transparent 70%); z-index: -1; }
        
        svg { width: 280px; filter: drop-shadow(0 0 30px rgba(0, 229, 255, 0.5)); transition: 0.5s; }
        svg:hover { transform: scale(1.05); }

        .mission-grid { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 900px; margin: 50px auto; gap: 30px; padding: 40px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; text-align: center; }
        .card h3 { color: var(--blue); letter-spacing: 2px; font-size: 14px; margin-bottom: 10px; }
        .card p { color: #666; font-size: 13px; line-height: 1.6; }

        .btn-launch { padding: 18px 50px; border: 1px solid #fff; color: #fff; text-decoration: none; border-radius: 40px; font-weight: 900; letter-spacing: 3px; font-size: 12px; transition: 0.4s; }
        .btn-launch:hover { background: #fff; color: #000; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
        
        .status-dot { width: 8px; height: 8px; background: var(--blue); border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 10px var(--blue); animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
