<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qynct One | TOSLIM ASAD MAHI</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
        
        /* সিনেম্যাটিক গ্লোয়িং গ্লোব (Pure CSS) */
        .globe-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0071e3, #000);
            box-shadow: inset -20px -20px 50px rgba(0,0,0,1), 0 0 100px rgba(0, 113, 227, 0.4);
            z-index: -1; animation: rotateGlobe 20s linear infinite;
        }
        @keyframes rotateGlobe { 
            0% { box-shadow: 0 0 80px rgba(0, 113, 227, 0.4); } 
            50% { box-shadow: 0 0 150px rgba(0, 113, 227, 0.6); } 
            100% { box-shadow: 0 0 80px rgba(0, 113, 227, 0.4); } 
        }

        nav { padding: 40px; display: flex; justify-content: space-between; position: fixed; width: 100%; box-sizing: border-box; }
        .logo { font-weight: 900; font-size: 26px; letter-spacing: -2px; }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: clamp(60px, 15vw, 220px); font-weight: 900; letter-spacing: -12px; line-height: 0.8; margin: 0; text-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .owner-tag { font-size: 14px; letter-spacing: 5px; color: #888; text-transform: uppercase; margin-top: 40px; }

        .footer-branding { position: fixed; bottom: 50px; left: 50px; border-left: 3px solid #fff; padding-left: 25px; }
        .footer-branding h3 { font-size: 32px; font-weight: 800; margin: 0; }
        .footer-branding p { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="globe-container"></div>

    <nav>
        <div class="logo">Qynct One</div>
        <div style="font-size: 11px; letter-spacing: 2px; font-weight: 700;">PROTOCOL ALPHA</div>
    </nav>

    <section class="hero">
        <h1>BEYOND<br>LIMITS.</h1>
        <p class="owner-tag">Architected by Toslim Asad Mahi</p>
    </section>

    <div class="footer-branding">
        <h3>TOSLIM ASAD MAHI</h3>
        <p>Founder & Chief Visionary Officer</p>
    </div>

</body>
</html>
